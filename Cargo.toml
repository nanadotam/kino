[package]
name = "kino"
version = "1.0.0"
description = "Kino - friendly Mac cleanup"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
libc = "0.2"

[features]
default = ["custom-protocol"]
# Serve the bundled ui/ folder instead of a dev server.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
